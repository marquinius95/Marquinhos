<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi página</title>
  <style>
  :root {
    color-scheme: light;
    --ink: #24213a;
    --muted: #716d83;
    --accent: #7357e8;
    --accent-dark: #5a40c6;
    --surface: #ffffff;
    --line: #e9e5f2;
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    max-width: 860px;
    margin: 0 auto;
    padding: 64px 24px;
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
    background:
      radial-gradient(ellipse at 10% 0%, #e8e1ff 0, transparent 38%),
      linear-gradient(160deg, #faf9ff, #f3f6ff);
  }

  h1 {
    margin: 0;
    font-size: clamp(2.8rem, 8vw, 4.8rem);
    line-height: 1.05;
    letter-spacing: -0.07em;
    background: linear-gradient(110deg, #6247d8, #c05dbd);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  body > p {
    margin: 16px 0 32px;
    color: var(--muted);
    font-size: 1.1rem;
  }

  h2 {
    margin: 40px 0 16px;
    font-size: 1.35rem;
    letter-spacing: -0.03em;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    border: 0;
    border-radius: 12px;
    padding: 11px 16px;
    color: white;
    background: var(--accent);
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 5px 14px #7357e833;
    transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
  }

  button:hover {
    transform: translateY(-2px);
    background: var(--accent-dark);
    box-shadow: 0 8px 18px #7357e844;
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  a:focus-visible {
    outline: 3px solid #aa98ff;
    outline-offset: 3px;
  }

  #logoutButton,
  .item button {
    color: var(--ink);
    background: #efedf5;
    box-shadow: none;
  }

  #logoutButton:hover,
  .item button:hover {
    background: #e3deef;
  }

  .admin {
    margin-top: 20px;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #ffffffc9;
    box-shadow: 0 12px 40px #33205e0d;
    backdrop-filter: blur(12px);
  }

  .admin h2 {
    margin-top: 0;
  }

  form label {
    display: inline-block;
    margin-top: 12px;
    color: #49445c;
    font-size: 0.92rem;
    font-weight: 650;
  }

  input,
  select {
    width: 100%;
    max-width: 520px;
    margin-top: 6px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    background: white;
  }

  input::placeholder {
    color: #aaa5b7;
  }

  form button {
    margin-top: 18px;
  }

  #contentList {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
    gap: 16px;
  }

  .item {
    min-width: 0;
    margin: 0;
    padding: 20px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 10px 30px #33205e0a;
    transition: transform 180ms ease, box-shadow 180ms ease;
  }

  .item:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 36px #33205e14;
  }

  .item h3 {
    margin: 0 0 12px;
    overflow-wrap: anywhere;
    font-size: 1.08rem;
  }

  .item a {
    color: var(--accent-dark);
    font-weight: 650;
    text-decoration: none;
  }

  .item a:hover {
    text-decoration: underline;
  }

  .item img {
    display: block;
    width: 100%;
    max-height: 280px;
    margin: 12px 0;
    border-radius: 12px;
    object-fit: cover;
  }

  .item iframe {
    display: block;
    width: 100%;
    height: 280px;
    margin: 12px 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #f7f5fb;
  }

  .item button {
    margin-top: 14px;
  }

  @media (max-width: 600px) {
    body {
      padding: 40px 18px;
    }

    .admin {
      padding: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <h1>POSTING PLACE</h1>
  <p>PARA PONER CUALQUIER COSA QUE QUIERAS TENDRAS QUE ENTRAR AL MODO ADMIN.</p>

  <button id="loginButton" type="button">Acceder como administrador(pista:inspeccionar)</button>
  <button id="logoutButton" type="button" hidden>Cerrar sesión de administrador</button>

  <section id="adminPanel" class="admin" hidden>
    <h2>Agregar cosas</h2>
    <form id="contentForm">
      <label for="contentType">Tipo de contenido:</label><br>
      <select id="contentType">
        <option value="link">Enlace</option>
        <option value="image">Imagen</option>
        <option value="preview">Vista previa de página</option>
      </select><br>

      <label for="title">Título:</label><br>
      <input id="title" required maxlength="100" placeholder="Por ejemplo, Mi sitio favorito"><br>

      <label for="url">Dirección web (URL):</label><br>
      <input id="url" type="url" required placeholder="https://ejemplo.com"><br>

      <button type="submit">Agregar</button>
    </form>
  </section>

  <h2>Contenido</h2>
  <div id="contentList"></div>

  <script>
    // Esta clave queda visible para cualquiera que inspeccione el código de la página.
    const ADMIN_PASSWORD = "Laterceracabraypuerta27";
    const STORAGE_KEY = "miPaginaContenido";

    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const adminPanel = document.getElementById("adminPanel");
    const contentForm = document.getElementById("contentForm");
    const contentList = document.getElementById("contentList");

    function getItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function makeSafeUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    function renderItems() {
      contentList.replaceChildren();
      const items = getItems();

      if (items.length === 0) {
        contentList.textContent = "Todavía no hay contenido agregado.";
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "item";

        const heading = document.createElement("h3");
        heading.textContent = item.title;
        card.appendChild(heading);

        if (item.type === "link") {
          const link = document.createElement("a");
          link.href = item.url;
          link.textContent = "Abrir enlace";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          card.appendChild(link);
        } else if (item.type === "image") {
          const image = document.createElement("img");
          image.src = item.url;
          image.alt = item.title;
          image.loading = "lazy";
          card.appendChild(image);
        } else if (item.type === "preview") {
          const note = document.createElement("p");
          note.textContent = "Algunas páginas no permiten mostrarse en una vista previa.";
          card.appendChild(note);

          const frame = document.createElement("iframe");
          frame.src = item.url;
          frame.title = "Vista previa: " + item.title;
          frame.loading = "lazy";
          frame.referrerPolicy = "no-referrer";
          frame.sandbox = "allow-scripts allow-forms";
          card.appendChild(frame);

          const link = document.createElement("a");
          link.href = item.url;
          link.textContent = "Abrir página en otra pestaña";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          card.appendChild(link);
        }

        if (!adminPanel.hidden) {
          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.textContent = "Eliminar";
          removeButton.addEventListener("click", () => {
            const updatedItems = getItems();
            updatedItems.splice(index, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedItems));
            renderItems();
          });
          card.appendChild(removeButton);
        }

        contentList.appendChild(card);
      });
    }

    loginButton.addEventListener("click", () => {
      const enteredPassword = prompt("Introduce la clave de administrador:");
      if (enteredPassword === ADMIN_PASSWORD) {
        adminPanel.hidden = false;
        loginButton.hidden = true;
        logoutButton.hidden = false;
        renderItems();
      } else if (enteredPassword !== null) {
        alert("Clave incorrecta.");
      }
    });

    logoutButton.addEventListener("click", () => {
      adminPanel.hidden = true;
      loginButton.hidden = false;
      logoutButton.hidden = true;
      renderItems();
    });

    contentForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const title = document.getElementById("title").value.trim();
      const url = makeSafeUrl(document.getElementById("url").value.trim());

      if (!url) {
        alert("Introduce una dirección válida que empiece con http:// o https://.");
        return;
      }

      const items = getItems();
      items.push({
        type: document.getElementById("contentType").value,
        title,
        url
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      contentForm.reset();
      renderItems();
    });

    renderItems();
  </script>
</body>
</html>
